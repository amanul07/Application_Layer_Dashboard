<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Layer Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #1f2937;
            color: white;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            width: 50%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .panel h2 {
            margin-top: 0;
        }

        .activity-box {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        textarea {
            height: 80px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .protocol {
            background: #111827;
            color: #e5e7eb;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .status {
            padding: 10px;
            background: #e5e7eb;
            border-radius: 5px;
            margin-top: 10px;
        }

        @media (max-width: 800px) {
            .dashboard {
                flex-direction: column;
            }

            .panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Computer Networks – Application Layer Dashboard</h1>

    <div class="dashboard">

        <!-- LEFT PANEL -->
        <div class="panel">

            <h2>Activity Panel</h2>

            <!-- Browsing -->
            <div class="activity-box">
                <h3>🌐 Browsing</h3>

                <input
                    type="text"
                    id="url"
                    placeholder="Enter URL e.g. example.com"
                >

                <button onclick="visitWebsite()">
                    Visit
                </button>
            </div>

            <!-- Mail -->
            <div class="activity-box">
                <h3>✉️ Mail</h3>

                <input
                    type="email"
                    id="to"
                    placeholder="To"
                >

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                >

                <textarea
                    id="body"
                    placeholder="Message"
                ></textarea>

                <button onclick="sendMail()">
                    Send
                </button>
            </div>

            <!-- Streaming -->
            <div class="activity-box">
                <h3>🎬 Streaming</h3>

                <select id="quality">
                    <option value="360p">360p</option>
                    <option value="720p">720p</option>
                    <option value="1080p">1080p</option>
                </select>

                <button onclick="playStream()">
                    Play
                </button>

                <button onclick="pauseStream()">
                    Pause
                </button>
            </div>

            <div class="status" id="status">
                Status: Waiting for an activity...
            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="panel">

            <h2>Protocol Visualization</h2>

            <div class="controls">
    <button onclick="pauseVisualization()">⏸ Pause</button>
    <button onclick="stepBackward()">⏮ Back</button>
    <button onclick="stepForward()">⏭ Next</button>
    <button onclick="replayVisualization()">🔄 Replay</button>
</div>
            <div id="protocolDisplay">
                
                <div class="protocol">
                    Waiting for activity...
                </div>
            </div>

        </div>

    </div>


    <script>

        let protocolMessages = [];
let currentStep = 0;
let isPaused = false;
let timer = null;
let visualizationStarted = false;

        function showProtocol(messages) {

            const display = document.getElementById("protocolDisplay");

            display.innerHTML = "";

            protocolMessages = messages;
currentStep = 0;
isPaused = false;

            function showNext() {
    if (isPaused) return;

    if (currentStep >= protocolMessages.length) return;

    const box = document.createElement("div");

    box.className = "protocol";

    box.textContent = protocolMessages[currentStep];

    display.appendChild(box);

    currentStep++;

    timer = setTimeout(showNext, 700);
}
            showNext();
        }


        function visitWebsite() {

            const url = document.getElementById("url").value;

            document.getElementById("status").textContent =
                "Status: Browsing " + url;

            showProtocol([
    "1. Client → DNS Server",
    "DNS Query: " + url,
    "Query Type: A",
    "",
    "2. DNS Server → Client",
    "DNS Response: 200 OK",
    "Answer: IP address returned",
    "",
    "3. Client → Web Server",
    "HTTP/1.1",
    "GET / HTTP/1.1",
    "Host: " + url,
    "Connection: keep-alive",
    "",
    "4. Web Server → Client",
    "HTTP/1.1 200 OK",
    "Content-Type: text/html",
    "Content-Length: 1256",
    "",
    "5. Web Server → Client",
    "HTML response data received"
]);
        }


        function sendMail() {

            const to = document.getElementById("to").value;

            document.getElementById("status").textContent =
                "Status: Sending mail to " + to;
        showProtocol([
    "1. Client → Mail Server",
    "EHLO client.example.com",
    "250-mail.example.com Hello client.example.com",
    "",
    "2. Client → Mail Server",
    "MAIL FROM: <sender@example.com>",
    "250 OK",
    "",
    "3. Client → Mail Server",
    "RCPT TO: <" + to + ">",
    "250 OK",
    "",
    "4. Client → Mail Server",
    "DATA",
    "354 Start mail input",
    "",
    "5. Client → Mail Server",
    "Subject: " + document.getElementById("subject").value,
    document.getElementById("body").value,
    ".",
    "250 OK - Message accepted",
    "",
    "6. Client → Mail Server",
    "QUIT",
    "221 Bye"
]);
        }


        function playStream() {

            const quality = document.getElementById("quality").value;

            document.getElementById("status").textContent =
                "Status: Streaming at " + quality;

            showProtocol([
    "1. Client → DNS Server",
    "DNS Query: video.example.com",
    "Query Type: A",
    "",
    "2. DNS Server → Client",
    "DNS Response: IP address returned",
    "",
    "3. Client → Streaming Server",
    "HTTP GET /manifest.m3u8 HTTP/1.1",
    "Host: video.example.com",
    "",
    "4. Streaming Server → Client",
    "HTTP/1.1 200 OK",
    "Content-Type: application/vnd.apple.mpegurl",
    "Manifest/Playlist received",
    "",
    "5. Client → Streaming Server",
    "HTTP GET /segment-1.ts HTTP/1.1",
    "Quality: " + quality,
    "",
    "6. Streaming Server → Client",
    "HTTP/1.1 200 OK",
    "Video segment received",
    "",
    "7. Client → Streaming Server",
    "HTTP GET /segment-2.ts HTTP/1.1",
    "",
    "8. Streaming Server → Client",
    "HTTP/1.1 200 OK",
    "Next video segment received"
]);  
        }

        function pauseVisualization() {
    isPaused = true;

    if (timer) {
        clearTimeout(timer);
        timer = null;
    }
}
        
        function stepForward() {
    isPaused = true;

    if (timer) {
        clearTimeout(timer);
        timer = null;
    }

    if (currentStep >= protocolMessages.length) {
        return;
    }

    const display = document.getElementById("protocolDisplay");

    const box = document.createElement("div");
    box.className = "protocol";
    box.textContent = protocolMessages[currentStep];

    display.appendChild(box);

    currentStep++;
}


function stepBackward() {
    isPaused = true;

    if (timer) {
        clearTimeout(timer);
        timer = null;
    }

    if (currentStep <= 0) {
        return;
    }

    currentStep--;

    const display = document.getElementById("protocolDisplay");

    display.innerHTML = "";

    for (let i = 0; i < currentStep; i++) {
        const box = document.createElement("div");
        box.className = "protocol";
        box.textContent = protocolMessages[i];
        display.appendChild(box);
    }
}
        function replayVisualization() {
    if (timer) {
        clearTimeout(timer);
        timer = null;
    }

    const display = document.getElementById("protocolDisplay");

    display.innerHTML = "";

    currentStep = 0;
    isPaused = false;

    function replayNext() {
        if (currentStep >= protocolMessages.length) {
            return;
        }

        const box = document.createElement("div");
        box.className = "protocol";
        box.textContent = protocolMessages[currentStep];

        display.appendChild(box);

        currentStep++;

        timer = setTimeout(replayNext, 700);
    }

    replayNext();
}
        function pauseStream() {

            document.getElementById("status").textContent =
                "Status: Streaming paused.";

        }

    </script>

</body>
</html>
